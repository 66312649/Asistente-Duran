<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUB Ferretería · Fijo</title>
  <style>
    :root{
      --bg:#0a1426; --ink:#e6f1ff; --muted:#9fb4c8;
      --electric:#00b6ff; --electric-2:#72e4ff; --line:rgba(114,228,255,.25);
      --amp:0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:var(--ink);background:radial-gradient(1200px 800px at 50% -10%,#0f213b 0%,#0b1a31 45%,var(--bg) 100%)}

    .hub{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:16px 20px 20px}

    /* Header */
    header.hdr{display:grid;grid-template-columns:1fr minmax(360px, 920px) 1fr;align-items:start;gap:10px}
    .clock{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px;color:var(--electric);display:inline-flex;flex-direction:column;align-items:flex-start}
    .clock .time{font-size:44px;line-height:1}
    .clock .date{font-size:14px;color:#88a4bd}

    .hdr-center{grid-column:2;display:grid;gap:12px;justify-items:center;text-align:center;width:min(92vw,920px);margin-inline:auto}
    .title{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--electric-2);text-shadow:0 0 18px rgba(0,182,255,.2)}

    .actions{grid-column:3;justify-self:end;display:flex;gap:10px;align-items:center}
    .btn-icon{width:32px;height:32px;border-radius:999px;border:2px solid var(--electric);display:grid;place-items:center;background:transparent;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 8px rgba(0,182,255,.3) inset;cursor:pointer;color:var(--electric)}
    .btn-icon:active{transform:scale(.96)}

    /* Search */
    .search{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(92vw,760px)}
    .search input{border:none;outline:none;background:transparent;color:var(--ink);font-size:18px;padding:8px 4px;width:100%}
    .search input::placeholder{color:#b8c9da}
    .pill{display:inline-grid;place-items:center;border:0;border-radius:999px;width:44px;height:44px;background:radial-gradient(120% 120% at 50% -10%,var(--electric-2),var(--electric));color:#00121e;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,182,255,.55)}
    .pill:active{transform:scale(.98)}

    /* Body */
    main.core{display:grid;grid-template-columns:260px 1fr 260px;gap:24px;align-items:center}
    .panel{padding:2px 0}
    .stack{display:grid;gap:12px}
    .tag{border:1.5px solid var(--electric);padding:12px 16px;font-weight:700;font-size:18px;color:#e9f7ff;background:rgba(0,182,255,.06);border-radius:14px;user-select:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .08s ease,box-shadow .2s ease,background .2s ease}
    .tag:hover{transform:translateY(-1px)}
    .tag[aria-pressed="true"]{background:rgba(0,182,255,.16);box-shadow:0 10px 24px rgba(0,0,0,.3),0 0 0 2px rgba(0,182,255,.18) inset}

    /* Sphere */
    .center{display:grid;place-items:center;padding:0 10px}
    .tech-wrap{position:relative;display:grid;place-items:center;height:clamp(300px, 46vh, 520px); width:100%}
    .sphere{position:relative; width:min(46vw,420px); aspect-ratio:1/1; border-radius:50%;
      background:
        radial-gradient(120% 120% at 50% 50%, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(70% 70% at 58% 60%, rgba(0,182,255,.28), transparent 70%),
        radial-gradient(55% 55% at 40% 35%, rgba(255,255,255,.6), rgba(255,255,255,.2) 35%, transparent 60%),
        radial-gradient(60% 60% at 50% 50%, rgba(0,22,44,.85), rgba(0,22,44,.35) 70%, transparent 100%);
      box-shadow: inset 0 0 40px rgba(114,228,255,.35), 0 0 calc(24px + 56px * var(--amp)) rgba(0,182,255,.55), 0 12px 40px rgba(0,0,0,.5);
      overflow:visible; isolation:isolate;
    }
    .sweep,.sweep2{position:absolute; inset:0; border-radius:50%; mix-blend-mode:screen; }
    .sweep{ background: conic-gradient(from 0deg, transparent 0 58%, rgba(114,228,255,.45) 60%, transparent 70% 100%); filter: blur(6px); animation: spin 11s linear infinite; }
    .sweep2{background: conic-gradient(from 180deg, transparent 0 70%, rgba(0,182,255,.35) 74%, transparent 86% 100%); filter: blur(8px); animation: spin 18s linear infinite reverse; }
    .ring{ position:absolute; inset:12%; border-radius:50%; border:1.5px dashed rgba(114,228,255,.35); }
    .ring.r2{ inset:6%;}
    .ring.r3{ inset:18%;}
    .bars span{ position:absolute; left:50%; top:50%; width:2.5px; height:40px; background:radial-gradient(circle, var(--electric-2), var(--electric)); border-radius:2px; transform-origin:50% 100%; opacity:.9; box-shadow:0 0 8px rgba(0,182,255,.55) }
    .tech-wrap.listening::before, .tech-wrap.listening::after{ content:""; position:absolute; border:3px solid rgba(114,228,255,.45); border-radius:50%; inset:4% 24%; animation: pulse 1.8s ease-out infinite; }
    .tech-wrap.listening::after{ animation-delay:.9s; inset:-2% 18%; }

    footer.ftr{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .bottom-tag{border:1.5px solid var(--electric);padding:16px 18px;font-weight:800;font-size:18px;color:#e9f7ff;background:rgba(0,182,255,.06);border-radius:14px;text-align:center;user-select:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}

    /* Results overlay */
    .results-overlay{position:fixed; inset:0; display:none; z-index:50; background:linear-gradient(180deg, rgba(6,12,26,.88), rgba(6,12,26,.92)); backdrop-filter: blur(6px);} 
    .results-overlay[aria-hidden="false"]{display:grid; grid-template-rows:auto 1fr;}
    .results-header{display:grid; grid-template-columns:1fr minmax(360px, 920px) 1fr; align-items:center; padding:16px 20px;}
    .results-header .centered{grid-column:2; display:grid; gap:10px; justify-items:center; text-align:center}
    .results-title{font-size:20px; font-weight:800; letter-spacing:.06em; color:var(--electric-2); text-transform:uppercase}
    .results-sub{font-size:14px; color:#b8c9da}
    .results-actions{grid-column:3; justify-self:end; display:flex; gap:10px}
    .results-body{padding: 8px 24px 24px; display:grid; grid-template-columns: minmax(0,1fr);} 
    .results-grid{margin: 0 auto; width:min(92vw, 1100px); display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px}
    .card{background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; grid-template-rows:auto auto 1fr auto; gap:8px; box-shadow: 0 10px 30px rgba(0,0,0,.35)}
    .card h3{margin:0; font-size:16px; color:#eaf4ff}
    .meta{font-size:12px; color:#9fb4c8; display:flex; gap:12px; flex-wrap:wrap}
    .meta span{white-space:nowrap}
    .price-stock{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
    .price{font-weight:800; font-size:18px; color:var(--ink)}
    .stock{font-weight:800; font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid var(--line)}
    .stock.ok{background:rgba(34,211,238,.12); border-color:rgba(34,211,238,.35); color:#c8f6ff}
    .stock.zero{background:rgba(255,143,107,.12); border-color:rgba(255,143,107,.35); color:#ffd8cb}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
    @media (max-width:1100px){ main.core{grid-template-columns:220px 1fr 220px} .clock .time{font-size:38px} }
    @media (max-width:900px){ header.hdr{grid-template-columns:1fr minmax(360px,1fr) 1fr} main.core{grid-template-columns:1fr;grid-auto-rows:auto} .left,.right{order:2} .center{order:1} footer.ftr{grid-template-columns:1fr 1fr} .results-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:560px){ .results-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="hub">
    <header class="hdr">
      <div class="clock"><div class="time" id="time">16:00</div><div class="date" id="date">Viernes · 04 de septiembre</div></div>
      <div class="hdr-center">
        <div class="title">¿En qué puedo ayudarle?</div>
        <div class="search" role="search">
          <input id="q" placeholder="Escribe o pulsa el micrófono para hablar…" aria-label="Buscar material o artículo" />
          <button class="pill" id="mic" aria-label="Hablar">🎤</button>
          <button class="pill" id="go" aria-label="Buscar">🔎</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn-icon" id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
        <button class="btn-icon" title="Modo administrador" aria-label="Modo administrador"></button>
      </div>
    </header>
    <main class="core">
      <aside class="left panel">
        <div class="stack" role="group" aria-label="Idioma">
          <div class="tag lang-chip" data-lang="es-ES" role="button" aria-pressed="true">Español</div>
          <div class="tag lang-chip" data-lang="en-US" role="button" aria-pressed="false">Inglés</div>
          <div class="tag lang-chip" data-lang="de-DE" role="button" aria-pressed="false">Alemán</div>
        </div>
      </aside>
      <section class="center">
        <div class="tech-wrap" id="techWrap">
          <div class="sphere" id="sphere">
            <div class="sweep"></div>
            <div class="sweep2"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="bars" id="bars"></div>
          </div>
        </div>
      </section>
      <aside class="right panel">
        <div class="stack" role="group" aria-label="Centro">
          <div class="tag center-chip" data-center="Palma" role="button" aria-pressed="false">Palma</div>
          <div class="tag center-chip" data-center="Calvià" role="button" aria-pressed="true">Calvià</div>
          <div class="tag center-chip" data-center="Alcúdia" role="button" aria-pressed="false">Alcúdia</div>
          <div class="tag center-chip" data-center="Santanyí" role="button" aria-pressed="false">Santanyí</div>
          <div class="tag center-chip" data-center="Santa Maria" role="button" aria-pressed="false">Santa Maria</div>
        </div>
      </aside>
    </main>
    <footer class="ftr">
      <div class="bottom-tag" role="button">Construcción</div>
      <div class="bottom-tag" role="button">Ferretería</div>
      <div class="bottom-tag" role="button">Fontanería</div>
      <div class="bottom-tag" role="button">Electricidad</div>
    </footer>
  </div>

  <section class="results-overlay" id="results" aria-hidden="true">
    <div class="results-header">
      <div></div>
      <div class="centered">
        <div class="results-title" id="resultsTitle">Resultados</div>
        <div class="results-sub" id="resultsSub"></div>
      </div>
      <div class="results-actions">
        <button class="back-btn" id="backBtn">← Volver</button>
      </div>
    </div>
    <div class="results-body">
      <div class="results-grid" id="resultsGrid"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    // ===== Reloj =====
    const $time=document.getElementById('time'), $date=document.getElementById('date');
    const fmt = new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'});
    const fmtDate = new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'2-digit',month:'long'});
    function tick(){const now=new Date();$time.textContent=fmt.format(now);const pretty=fmtDate.format(now).replace(',', '');$date.textContent=pretty.charAt(0).toUpperCase()+pretty.slice(1);} tick(); setInterval(tick,1000);

    // ===== Fullscreen (compatible) =====
    const fsBtn = document.getElementById('fsBtn');
    fsBtn.onclick = () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    };

    // ===== Esfera reactiva =====
    const micBtn=document.getElementById('mic'); const wrap=document.getElementById('techWrap'); const sphere=document.getElementById('sphere'); const barsBox=document.getElementById('bars');
    let listening=false,audioCtx=null,analyser=null,data=null,stream=null; const N=48; let bars=[];
    function buildBars(){ barsBox.innerHTML=''; bars=[]; const size=sphere.offsetWidth, R=size*0.44; for(let i=0;i<N;i++){ const el=document.createElement('span'); el.style.transform=`translate(-50%,-50%) rotate(${(360/N*i)}deg) translateY(${-R}px)`; barsBox.appendChild(el); bars.push(el);} }
    buildBars(); addEventListener('resize', buildBars);
    micBtn.addEventListener('click', async ()=>{ listening=!listening; wrap.classList.toggle('listening', listening); if(listening){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); stream=await navigator.mediaDevices.getUserMedia({audio:true}); const src=audioCtx.createMediaStreamSource(stream); analyser=audioCtx.createAnalyser(); analyser.fftSize=512; src.connect(analyser); data=new Uint8Array(analyser.frequencyBinCount);}catch(e){ console.warn('Mic no disponible', e);} } else { if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} } });
    function animate(t){ let amp=0.08; if(listening&&analyser&&data){ analyser.getByteFrequencyData(data); let sum=0; for(let i=0;i<32;i++) sum+=data[i]; amp=Math.min(1,(sum/32)/150); } else { amp=0.12+0.06*Math.sin(t/800);} sphere.style.setProperty('--amp', amp.toFixed(3)); for(let i=0;i<bars.length;i++){ const h=24+(90*amp)*(0.6+0.4*Math.sin(t/250+i*0.35)); bars[i].style.height=h+'px'; bars[i].style.opacity=0.6+0.4*amp; } requestAnimationFrame(animate);} requestAnimationFrame(animate);

    // ===== Idioma y centro (locución) =====
    const langChips=[...document.querySelectorAll('.lang-chip')]; const centerChips=[...document.querySelectorAll('.center-chip')];
    window.currentLang = window.currentLang || 'es-ES';
    const PHRASES={ 'es-ES':{ prompt:'¿En qué puedo ayudarle?', center:n=>`Centro seleccionado: ${n}` }, 'en-US':{ prompt:'How can I help you?', center:n=>`Selected center: ${n}` }, 'de-DE':{ prompt:'Womit kann ich Ihnen helfen?', center:n=>`Ausgewählter Standort: ${n}` } };
    function pickVoice(lang){ const list=speechSynthesis.getVoices(); let v=list.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.toLowerCase())); if(!v) v=list.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); return v||list[0]; }
    function speak(text,lang){ if(!('speechSynthesis'in window)) return; const u=new SpeechSynthesisUtterance(text); const v=pickVoice(lang); if(v) u.voice=v; u.lang=lang; u.rate=1; u.pitch=1.03; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    function selectLang(el){ langChips.forEach(c=>c.setAttribute('aria-pressed', c===el?'true':'false')); window.currentLang=el.dataset.lang||'es-ES'; speak(PHRASES[window.currentLang].prompt, window.currentLang); }
    function selectCenter(el){ centerChips.forEach(c=>c.setAttribute('aria-pressed', c===el?'true':'false')); const name=el.dataset.center||el.textContent.trim(); speak(PHRASES[window.currentLang].center(name), window.currentLang); }
    langChips.forEach(ch=> ch.addEventListener('click', ()=> selectLang(ch))); centerChips.forEach(ch=> ch.addEventListener('click', ()=> selectCenter(ch))); speechSynthesis.onvoiceschanged=()=>{};

    // ===== Buscador conectado a GitHub =====
    const REPO_BASE='https://raw.githubusercontent.com/66312649/Asistente-Duran/main/imports/';
    const PRICE_FILE='Lista%20de%20art%C3%ADculos.xlsx';
    const STOCK_FILE=n=>`Stock_Almacen_${n}_20250915.xlsx`;
    const CENTER_CODE={ 'Palma':1,'Calvià':2,'Alcúdia':3,'Santanyí':4,'Santa Maria':7 };
    const CODE_TO_CENTER=Object.fromEntries(Object.entries(CENTER_CODE).map(([k,v])=>[v,k]));

    const q=document.getElementById('q');
    const goBtn=document.getElementById('go');
    const resultsEl=document.getElementById('results');
    const gridEl=document.getElementById('resultsGrid');
    const backBtn=document.getElementById('backBtn');
    const titleEl=document.getElementById('resultsTitle');
    const subEl=document.getElementById('resultsSub');

    function getCurrentCenterName(){ const el=document.querySelector('.center-chip[aria-pressed="true"]'); return el?(el.dataset.center||el.textContent.trim()):'Calvià'; }
    function getCurrentCenterCode(){ return CENTER_CODE[getCurrentCenterName()]||2; }

    function normKey(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
    function pickCol(cols,hints){ const nn=cols.map(c=>({raw:c,n:normKey(c)})); for(const c of nn){ if(hints.every(h=>c.n.includes(h))) return c.raw; } for(const c of nn){ if(hints.some(h=>c.n.includes(h))) return c.raw; } return null; }

    async function fetchWorkbook(file){ const url=REPO_BASE+file; const res=await fetch(url,{cache:'no-store',mode:'cors'}); if(!res.ok) throw new Error('HTTP '+res.status+' en '+file); const ab=await res.arrayBuffer(); return XLSX.read(ab,{type:'array'}); }
    function sheetToJSON(wb){ const name=wb.SheetNames.find(n=>/Hoja1|ALM|Sheet1/i.test(n))||wb.SheetNames[0]; return XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:null}); }

    const cache={ prices:null, stock:{} };
    async function loadPrices(){ if(cache.prices) return cache.prices; const wb=await fetchWorkbook(PRICE_FILE); const rows=sheetToJSON(wb); console.log('[PRECIOS] Filas:', rows.length); const cols=rows.length?Object.keys(rows[0]):[]; const cNum=pickCol(cols,['numero','articulo']); const cDesc=pickCol(cols,['descripcion','articulo']); const cFab=pickCol(cols,['fabricante']); const cPvp=pickCol(cols,['1','lista','precio','venta']); const map=new Map(); for(const r of rows){ const id=r[cNum]; if(id==null) continue; const key=String(id).trim(); map.set(key,{numero_articulo:key, descripcion:r[cDesc]||'', fabricante:r[cFab]||'', pvp:r[cPvp]}); } cache.prices=map; return map; }
    async function loadStock(center){ if(cache.stock[center]) return cache.stock[center]; const wb=await fetchWorkbook(STOCK_FILE(center)); const rows=sheetToJSON(wb); console.log('[STOCK] Centro', center, 'Filas:', rows.length); const cols=rows.length?Object.keys(rows[0]):[]; const cNum=pickCol(cols,['numero','articulo']); const cRef=pickCol(cols,['referencia','proveedor']); const cDesc=pickCol(cols,['descripcion']); const cFab=pickCol(cols,['fabricante']); const cStk=pickCol(cols,['stock']); const list=rows.map(r=>({ numero_articulo:String(r[cNum]||'').trim(), ref_proveedor:r[cRef]||'', descripcion:r[cDesc]||'', fabricante:r[cFab]||'', stock:Number(r[cStk]||0) })).filter(x=>x.numero_articulo); cache.stock[center]=list; return list; }

    function formatEUR(val){ if(val==null||val==='') return '-'; const n=(typeof val==='number')?val:parseFloat(String(val).replace(/\./g,'').replace(',','.')); if(!isFinite(n)) return '-'; return n.toLocaleString(window.currentLang||'es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
    function mergeItem(s,p){ return { numero_articulo:s.numero_articulo, ref_proveedor:s.ref_proveedor||null, descripcion_final:p?.descripcion||s.descripcion||'-', fabricante:p?.fabricante||s.fabricante||'-', stock:s.stock||0, precio_eur:formatEUR(p?.pvp) }; }
    function score(qs,it){
      const t = String(qs||'').toLowerCase();
      if(!t) return 0;
      const parts = t.trim().split(' ').filter(Boolean);
      const d = String(it.descripcion_final==null? '' : it.descripcion_final).toLowerCase();
      const r = String(it.ref_proveedor==null? '' : it.ref_proveedor).toLowerCase();
      const n = String(it.numero_articulo==null? '' : it.numero_articulo).toLowerCase();
      let s=0;
      for(const tok of parts){ if(d.includes(tok)) s+=3; if(r.includes(tok)) s+=2; if(n.includes(tok)) s+=1.5; }
      return s;
    }); return s; }

    function render(items, qStr){ const L=window.currentLang||'es-ES'; const TXT={ 'es-ES':{results:'Resultados',of:'coincidencias',back:'← Volver',price:'Precio',stock:'Stock',prov:'Ref. proveedor',mfg:'Fabricante', alt:(n,qty)=>`Actualmente no disponemos de stock en este centro, pero en el centro de ${n} disponemos de ${qty} unidades. Por favor, hable con el mostrador para tramitar el suministro.`}, 'en-US':{results:'Results',of:'matches',back:'← Back',price:'Price',stock:'Stock',prov:'Supplier ref.',mfg:'Manufacturer', alt:(n,qty)=>`We currently have no stock at this store, but ${qty} units are available at the ${n} branch. Please speak to the counter to arrange supply.`}, 'de-DE':{results:'Ergebnisse',of:'Treffer',back:'← Zurück',price:'Preis',stock:'Bestand',prov:'Lieferantenref.',mfg:'Hersteller', alt:(n,qty)=>`Derzeit kein Bestand in diesem Standort, aber ${qty} Stück sind im Standort ${n} verfügbar. Bitte wenden Sie sich an den Schalter für die Bestellung.`} }[L];
      titleEl.textContent=TXT.results; subEl.textContent=`${items.length} ${TXT.of} · Centro: ${getCurrentCenterName()} · “${qStr}”`; backBtn.textContent=TXT.back;
      gridEl.innerHTML=items.map(it=>{ const ok=(Number(it.stock)||0)>0; const badge= ok?`<span class="stock ok">${TXT.stock}: ${it.stock}</span>`:`<span class="stock zero">${TXT.stock}: 0</span>`; const alt=it._altStock?`<div class="meta" style="margin-top:6px"><em>${TXT.alt(CODE_TO_CENTER[it._altStock.center], it._altStock.qty)}</em></div>`:''; return `<article class="card" role="button" tabindex="0" data-id="${it.numero_articulo}"><h3>${it.descripcion_final}</h3><div class="meta"><span><strong>${TXT.prov}:</strong> ${it.ref_proveedor??'-'}</span><span><strong>${TXT.mfg}:</strong> ${it.fabricante??'-'}</span></div><div class="price-stock"><div class="price">${it.precio_eur}</div>${badge}</div>${alt}</article>`; }).join('');
      resultsEl.setAttribute('aria-hidden','false'); }

    async function findAltStock(numArt, excludeCenter){ for(const c of [1,2,3,4,7]){ if(c===excludeCenter) continue; const list=await loadStock(c); const hit=list.find(x=>x.numero_articulo===numArt && Number(x.stock)>0); if(hit) return {center:c, qty:Number(hit.stock)}; } return null; }

    async function performSearch(query){ try{ const center=getCurrentCenterCode(); titleEl.textContent='Resultados'; subEl.textContent='Cargando…'; resultsEl.setAttribute('aria-hidden','false'); const [prices, stock]=await Promise.all([loadPrices(), loadStock(center)]); const merged=stock.map(s=>mergeItem(s, prices.get(s.numero_articulo))); merged.forEach(m=>m.__score=score(query,m)); merged.sort((a,b)=>b.__score-a.__score); let top=merged.filter(x=>x.__score>0).slice(0,6); if(top.length===0) top=merged.slice(0,6); for(const it of top){ if(Number(it.stock)<=0){ it._altStock=await findAltStock(it.numero_articulo, center);} } render(top, query); } catch(e){ console.error('[performSearch] Error', e); subEl.textContent='Error cargando datos: '+(e&&e.message?e.message:e); } }

    // Exponer para depurar
    window.__searchRepo = performSearch;

    // Go + Enter
    goBtn.onclick=()=> performSearch(q.value.trim());
    q.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); performSearch(q.value.trim()); } };

    // ===== Voz real (SpeechRecognition) =====
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    function startSpeech(){ if(!SR){ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='Reconocimiento de voz no disponible'; return; } const isSecure= location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname); if(!isSecure){ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='La voz requiere HTTPS o ejecutar en localhost'; return; } const rec=new SR(); rec.lang=window.currentLang||'es-ES'; rec.interimResults=false; rec.maxAlternatives=1; rec.onresult=(ev)=>{ let final=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) final+= r[0].transcript + ' '; } if(final.trim()){ q.value=(q.value? q.value+' ' : '') + final.trim(); performSearch(q.value.trim()); } }; rec.onerror=()=>{ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='No se pudo captar audio'; }; try{ rec.start(); }catch(e){} }
    micBtn && micBtn.addEventListener('click', startSpeech);

    // Cerrar overlay
    backBtn.addEventListener('click', ()=> resultsEl.setAttribute('aria-hidden','true'));
  </script>
</body>
</html>
