<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUB Ferretería · Fijo v2</title>
  <style>
    :root{
      --bg:#0a1426; --ink:#e6f1ff; --muted:#9fb4c8;
      --electric:#00b6ff; --electric-2:#72e4ff; --line:rgba(114,228,255,.25);
      --amp:0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:var(--ink);background:radial-gradient(1200px 800px at 50% -10%,#0f213b 0%,#0b1a31 45%,var(--bg) 100%)}

    .hub{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:16px 20px 20px}

    /* Header */
    header.hdr{display:grid;grid-template-columns:1fr minmax(360px, 920px) 1fr;align-items:start;gap:10px}
    .clock{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px;color:var(--electric);display:inline-flex;flex-direction:column;align-items:flex-start}
    .clock .time{font-size:44px;line-height:1}
    .clock .date{font-size:14px;color:#88a4bd}

    .hdr-center{grid-column:2;display:grid;gap:12px;justify-items:center;text-align:center;width:min(92vw,920px);margin-inline:auto}
    .title{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--electric-2);text-shadow:0 0 18px rgba(0,182,255,.2)}

    .actions{grid-column:3;justify-self:end;display:flex;gap:10px;align-items:center}
    .btn-icon{width:32px;height:32px;border-radius:999px;border:2px solid var(--electric);display:grid;place-items:center;background:transparent;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 8px rgba(0,182,255,.3) inset;cursor:pointer;color:var(--electric)}
    .btn-icon:active{transform:scale(.96)}

    /* Search */
    .search{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(92vw,760px)}
    .search input{border:none;outline:none;background:transparent;color:var(--ink);font-size:18px;padding:8px 4px;width:100%}
    .search input::placeholder{color:#b8c9da}
    .pill{display:inline-grid;place-items:center;border:0;border-radius:999px;width:44px;height:44px;background:radial-gradient(120% 120% at 50% -10%,var(--electric-2),var(--electric));color:#00121e;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,182,255,.55)}
    .pill:active{transform:scale(.98)}

    /* Body */
    main.core{display:grid;grid-template-columns:260px 1fr 260px;gap:24px;align-items:center}
    .panel{padding:2px 0}
    .stack{display:grid;gap:12px}
    .tag{border:1.5px solid var(--electric);padding:12px 16px;font-weight:700;font-size:18px;color:#e9f7ff;background:rgba(0,182,255,.06);border-radius:14px;user-select:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .08s ease,box-shadow .2s ease,background .2s ease}
    .tag:hover{transform:translateY(-1px)}
    .tag[aria-pressed="true"]{background:rgba(0,182,255,.16);box-shadow:0 10px 24px rgba(0,0,0,.3),0 0 0 2px rgba(0,182,255,.18) inset}

    /* Sphere */
    .center{display:grid;place-items:center;padding:0 10px}
    .tech-wrap{position:relative;display:grid;place-items:center;height:clamp(300px, 46vh, 520px); width:100%}
    .sphere{position:relative; width:min(46vw,420px); aspect-ratio:1/1; border-radius:50%;
      background:
        radial-gradient(120% 120% at 50% 50%, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(70% 70% at 58% 60%, rgba(0,182,255,.28), transparent 70%),
        radial-gradient(55% 55% at 40% 35%, rgba(255,255,255,.6), rgba(255,255,255,.2) 35%, transparent 60%),
        radial-gradient(60% 60% at 50% 50%, rgba(0,22,44,.85), rgba(0,22,44,.35) 70%, transparent 100%);
      box-shadow: inset 0 0 40px rgba(114,228,255,.35), 0 0 calc(24px + 56px * var(--amp)) rgba(0,182,255,.55), 0 12px 40px rgba(0,0,0,.5);
      overflow:visible; isolation:isolate;
    }
    .sweep,.sweep2{position:absolute; inset:0; border-radius:50%; mix-blend-mode:screen; }
    .sweep{ background: conic-gradient(from 0deg, transparent 0 58%, rgba(114,228,255,.45) 60%, transparent 70% 100%); filter: blur(6px); animation: spin 11s linear infinite; }
    .sweep2{background: conic-gradient(from 180deg, transparent 0 70%, rgba(0,182,255,.35) 74%, transparent 86% 100%); filter: blur(8px); animation: spin 18s linear infinite reverse; }
    .ring{ position:absolute; inset:12%; border-radius:50%; border:1.5px dashed rgba(114,228,255,.35); }
    .ring.r2{ inset:6%;}
    .ring.r3{ inset:18%;}
    .bars span{ position:absolute; left:50%; top:50%; width:2.5px; height:40px; background:radial-gradient(circle, var(--electric-2), var(--electric)); border-radius:2px; transform-origin:50% 100%; opacity:.9; box-shadow:0 0 8px rgba(0,182,255,.55) }
    .tech-wrap.listening::before, .tech-wrap.listening::after{ content:""; position:absolute; border:3px solid rgba(114,228,255,.45); border-radius:50%; inset:4% 24%; animation: pulse 1.8s ease-out infinite; }
    .tech-wrap.listening::after{ animation-delay:.9s; inset:-2% 18%; }

    footer.ftr{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .bottom-tag{border:1.5px solid var(--electric);padding:16px 18px;font-weight:800;font-size:18px;color:#e9f7ff;background:rgba(0,182,255,.06);border-radius:14px;text-align:center;user-select:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}

    /* Results overlay */
    .results-overlay{position:fixed; inset:0; display:none; z-index:50; background:linear-gradient(180deg, rgba(6,12,26,.88), rgba(6,12,26,.92)); backdrop-filter: blur(6px);} 
    .results-overlay[aria-hidden="false"]{display:grid; grid-template-rows:auto 1fr;}
    .results-header{display:grid; grid-template-columns:1fr minmax(360px, 920px) 1fr; align-items:center; padding:16px 20px;}
    .results-header .centered{grid-column:2; display:grid; gap:10px; justify-items:center; text-align:center}
    .results-title{font-size:20px; font-weight:800; letter-spacing:.06em; color:var(--electric-2); text-transform:uppercase}
    .results-sub{font-size:14px; color:#b8c9da}
    .results-actions{grid-column:3; justify-self:end; display:flex; gap:10px}
    .results-body{padding: 8px 24px 24px; display:grid; grid-template-columns: minmax(0,1fr);} 
    .results-grid{margin: 0 auto; width:min(92vw, 1100px); display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px}
    .card{background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; grid-template-rows:auto auto 1fr auto; gap:8px; box-shadow: 0 10px 30px rgba(0,0,0,.35)}
    .card h3{margin:0; font-size:16px; color:#eaf4ff}
    .meta{font-size:12px; color:#9fb4c8; display:flex; gap:12px; flex-wrap:wrap}
    .meta span{white-space:nowrap}
    .price-stock{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
    .price{font-weight:800; font-size:18px; color:var(--ink)}
    .stock{font-weight:800; font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid var(--line)}
    .stock.ok{background:rgba(34,211,238,.12); border-color:rgba(34,211,238,.35); color:#c8f6ff}
    .stock.zero{background:rgba(255,143,107,.12); border-color:rgba(255,143,107,.35); color:#ffd8cb}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
    @media (max-width:1100px){ main.core{grid-template-columns:220px 1fr 220px} .clock .time{font-size:38px} }
    @media (max-width:900px){ header.hdr{grid-template-columns:1fr minmax(360px,1fr) 1fr} main.core{grid-template-columns:1fr;grid-auto-rows:auto} .left,.right{order:2} .center{order:1} footer.ftr{grid-template-columns:1fr 1fr} .results-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:560px){ .results-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="hub">
    <header class="hdr">
      <div class="clock"><div class="time" id="time">16:00:00</div><div class="date" id="date">Martes · 16 de septiembre</div></div>
      <div class="hdr-center">
        <div class="title">¿En qué puedo ayudarle?</div>
        <div class="search" role="search">
          <input id="q" placeholder="Escribe o pulsa el micrófono para hablar…" aria-label="Buscar material o artículo" />
          <button class="pill" id="mic" aria-label="Hablar">🎤</button>
          <button class="pill" id="go" aria-label="Buscar">🔎</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn-icon" id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
        <button class="btn-icon" title="Modo administrador" aria-label="Modo administrador"></button>
      </div>
    </header>
    <main class="core">
      <aside class="left panel">
        <div class="stack" role="group" aria-label="Idioma">
          <div class="tag lang-chip" data-lang="es-ES" role="button" aria-pressed="true">Español</div>
          <div class="tag lang-chip" data-lang="en-US" role="button" aria-pressed="false">Inglés</div>
          <div class="tag lang-chip" data-lang="de-DE" role="button" aria-pressed="false">Alemán</div>
        </div>
      </aside>
      <section class="center">
        <div class="tech-wrap" id="techWrap">
          <div class="sphere" id="sphere">
            <div class="sweep"></div>
            <div class="sweep2"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="bars" id="bars"></div>
          </div>
        </div>
      </section>
      <aside class="right panel">
        <div class="stack" role="group" aria-label="Centro">
          <div class="tag center-chip" data-center="Palma" role="button" aria-pressed="false">Palma</div>
          <div class="tag center-chip" data-center="Calvià" role="button" aria-pressed="true">Calvià</div>
          <div class="tag center-chip" data-center="Alcúdia" role="button" aria-pressed="false">Alcúdia</div>
          <div class="tag center-chip" data-center="Santanyí" role="button" aria-pressed="false">Santanyí</div>
          <div class="tag center-chip" data-center="Santa Maria" role="button" aria-pressed="false">Santa Maria</div>
        </div>
      </aside>
    </main>
    <footer class="ftr">
      <div class="bottom-tag" role="button">Construcción</div>
      <div class="bottom-tag" role="button">Ferretería</div>
      <div class="bottom-tag" role="button">Fontanería</div>
      <div class="bottom-tag" role="button">Electricidad</div>
    </footer>
  </div>

  <section class="results-overlay" id="results" aria-hidden="true">
    <div class="results-header">
      <div></div>
      <div class="centered">
        <div class="results-title" id="resultsTitle">Resultados</div>
        <div class="results-sub" id="resultsSub"></div>
      </div>
      <div class="results-actions">
        <button class="back-btn" id="backBtn">← Volver</button>
      </div>
    </div>
    <div class="results-body">
      <div class="results-grid" id="resultsGrid"></div>
    </div>
  </section>

  <!-- Polyfills + diagnóstico (compatibilidad tablets) -->
  <script>
    // String.normalize para motores antiguos
    if(!String.prototype.normalize){ String.prototype.normalize = function(){ return String(this); }; }
    // Array.find / includes y String.includes
    if(!Array.prototype.find){ Array.prototype.find=function(fn, thisArg){ if(this==null) throw new TypeError('Array.prototype.find called on null'); var o=Object(this), len=o.length>>>0; for(var i=0;i<len;i++){ var v=o[i]; if(fn.call(thisArg, v, i, o)) return v; } return undefined; }; }
    if(!Array.prototype.includes){ Array.prototype.includes=function(search, start){ var o=Object(this), len=o.length>>>0, k=start|0; if(k<0) k=Math.max(len+k,0); for(;k<len;k++){ if(o[k]===search) return true; } return false; }; }
    if(!String.prototype.includes){ String.prototype.includes=function(substr, pos){ return this.indexOf(substr, pos||0) !== -1; }; }
    // Captura de errores globales
    window.addEventListener('error', function(e){ console.error('[HUB:error]', e && (e.message||e.filename||e)); });
    window.addEventListener('unhandledrejection', function(e){ console.error('[HUB:promise]', e && (e.reason||e)); });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    // ===== Reloj =====
    (function(){
      var $time=document.getElementById('time'), $date=document.getElementById('date');
      var fmtTime = new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      var fmtDate = new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'2-digit',month:'long'});
      function tick(){
        var now=new Date();
        if($time) $time.textContent = fmtTime.format(now);
        if($date){ var pretty = fmtDate.format(now).replace(',', ''); $date.textContent = pretty.charAt(0).toUpperCase()+pretty.slice(1); }
      }
      tick(); setInterval(function(){ requestAnimationFrame(tick); },1000);
    })();

    // ===== Fullscreen (compatible) =====
    (function(){
      var fsBtn = document.getElementById('fsBtn');
      fsBtn.onclick = function(){
        var el = document.documentElement;
        if (!document.fullscreenElement) {
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
          else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        }
      };
    })();

    // ===== Esfera reactiva =====
    (function(){
      var micBtn=document.getElementById('mic'); var wrap=document.getElementById('techWrap'); var sphere=document.getElementById('sphere'); var barsBox=document.getElementById('bars');
      var listening=false,audioCtx=null,analyser=null,data=null,stream=null; var N=48; var bars=[];
      function buildBars(){ barsBox.innerHTML=''; bars=[]; var size=sphere.offsetWidth, R=size*0.44; for(var i=0;i<N;i++){ var el=document.createElement('span'); el.style.transform='translate(-50%,-50%) rotate('+(360/N*i)+'deg) translateY('+(-R)+'px)'; barsBox.appendChild(el); bars.push(el);} }
      buildBars(); addEventListener('resize', buildBars);
      function animate(t){
        var amp = 0.10;
        if(listening && analyser){
          var timeData = new Uint8Array(analyser.fftSize||2048);
          analyser.getByteTimeDomainData(timeData);
          var sum=0; for(var i=0;i<timeData.length;i++){ var v=(timeData[i]-128)/128; sum+=v*v; }
          var rms = Math.sqrt(sum/timeData.length);
          amp = Math.min(1, 0.2 + rms*1.8);
        } else { amp = 0.12 + 0.06*Math.sin(t/800); }
        sphere.style.setProperty('--amp', amp.toFixed(3));
        for(var j=0;j<bars.length;j++){
          var h = 24 + (90*amp)*(0.6 + 0.4*Math.sin(t/250 + j*0.35));
          bars[j].style.height = h+'px';
          bars[j].style.opacity = 0.6 + 0.4*amp;
        }
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      micBtn.addEventListener('click', function(){
        listening = !listening; wrap.classList.toggle('listening', listening);
        if(listening){
          try{
            if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
            if(audioCtx.state==='suspended'){ audioCtx.resume().catch(function(){}); }
            navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
              stream = s; var src = audioCtx.createMediaStreamSource(stream);
              analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; src.connect(analyser);
              data = new Uint8Array(analyser.frequencyBinCount);
            }).catch(function(err){ console.warn('Micrófono no disponible', err); });
          }catch(e){ console.warn('AudioContext no disponible', e); }
        } else {
          if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
        }
      });
    })();

    // ===== Idioma y centro (locución) =====
    (function(){
      var langChips=[].slice.call(document.querySelectorAll('.lang-chip'));
      var centerChips=[].slice.call(document.querySelectorAll('.center-chip'));
      window.currentLang = window.currentLang || 'es-ES';
      var PHRASES={ 'es-ES':{ prompt:'¿En qué puedo ayudarle?', center:function(n){return 'Centro seleccionado: '+n;} }, 'en-US':{ prompt:'How can I help you?', center:function(n){return 'Selected center: '+n;} }, 'de-DE':{ prompt:'Womit kann ich Ihnen helfen?', center:function(n){return 'Ausgewählter Standort: '+n;} } };

      function voicesReady(timeout){ timeout = timeout||2000; return new Promise(function(res){ var list=speechSynthesis.getVoices(); if(list&&list.length){ res(list); return;} var t=setTimeout(function(){ res(speechSynthesis.getVoices()); },timeout); speechSynthesis.onvoiceschanged=function(){ clearTimeout(t); res(speechSynthesis.getVoices()); }; }); }
      function pickVoice(lang){ return voicesReady().then(function(list){ if(!list||!list.length) return null; var v=list.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf(lang.toLowerCase())===0; }); if(!v) v=list.find(function(v){return v.lang && v.lang.toLowerCase().indexOf(lang.slice(0,2).toLowerCase())===0;}); return v||list[0]; }); }
      function speak(text,lang){ if(!('speechSynthesis' in window)) return; pickVoice(lang).then(function(voice){ try{ var u=new SpeechSynthesisUtterance(text); if(voice) u.voice=voice; u.lang=lang; u.rate=1; u.pitch=1.03; u.volume=1; try{ speechSynthesis.cancel(); }catch(e){} setTimeout(function(){ try{ speechSynthesis.speak(u); }catch(e){} }, 60); }catch(e){} }); }catch(e){} }); }

      function selectLang(el){ langChips.forEach(function(c){ c.setAttribute('aria-pressed', c===el ? 'true':'false'); }); window.currentLang=el.getAttribute('data-lang')||'es-ES'; speak(PHRASES[window.currentLang].prompt, window.currentLang); }
      function selectCenter(el){ centerChips.forEach(function(c){ c.setAttribute('aria-pressed', c===el ? 'true':'false'); }); var name=el.getAttribute('data-center')||el.textContent.trim(); speak(PHRASES[window.currentLang].center(name), window.currentLang); }

      langChips.forEach(function(ch){ ch.addEventListener('click', function(){ selectLang(ch); }); });
      centerChips.forEach(function(ch){ ch.addEventListener('click', function(){ selectCenter(ch); }); });
      try{ window.speechSynthesis && speechSynthesis.getVoices(); }catch(e){}

      // export para depurar
      window._tts = {speak:speak};
    })();

    // ===== Buscador conectado a GitHub =====
    (function(){
      var REPO_BASE='https://raw.githubusercontent.com/66312649/Asistente-Duran/main/imports/';
      var PRICE_FILE='Lista%20de%20art%C3%ADculos.xlsx';
      var STOCK_FILE=function(n){ return 'Stock_Almacen_'+n+'_20250915.xlsx'; };
      var CENTER_CODE={ 'Palma':1,'Calvià':2,'Alcúdia':3,'Santanyí':4,'Santa Maria':7 };
      var CODE_TO_CENTER={1:'Palma',2:'Calvià',3:'Alcúdia',4:'Santanyí',7:'Santa Maria'};

      var q=document.getElementById('q');
      var goBtn=document.getElementById('go');
      var resultsEl=document.getElementById('results');
      var gridEl=document.getElementById('resultsGrid');
      var backBtn=document.getElementById('backBtn');
      var titleEl=document.getElementById('resultsTitle');
      var subEl=document.getElementById('resultsSub');

      function getCurrentCenterName(){ var el=document.querySelector('.center-chip[aria-pressed="true"]'); return el?(el.getAttribute('data-center')||el.textContent.trim()):'Calvià'; }
      function getCurrentCenterCode(){ var n=getCurrentCenterName(); return CENTER_CODE[n]||2; }

      function normKey(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
      // Stopwords + sinónimos + fuzziness (aditivo)
      var STOPWORDS = new Set(['de','del','la','el','los','las','un','una','unos','unas','para','por','con','en','y','o','a','al','lo','su','sus','mi','tu','mm','m','º','°','the','and','of','for','mit','der','die','das','und']);
      var SYN_GROUPS = [
        ['llave inglesa','llave ajustable','ajustable','francesa'],
        ['cinta teflon','teflon','ptfe','cinta ptfe'],
        ['grifo','monomando','mezclador'],
        ['sifon','sifón','desague','desagüe'],
        ['tubo multicapa','multicapa','pex-al-pex','alpex'],
        ['abrazadera','brida','collarin','collarín'],
        ['tornillo','tornilleria','screw'],
        ['tuerca','nut'],
        ['manguito','acoplador','conector','manguito reductor','manguito reduccion'],
        ['valvula','válvula','llave de paso','llave corte','esfera'],
        ['filtro','prefiltro','cartucho'],
        ['codo','angulo','ángulo','elbow'],
        ['curva','codo largo'],
        ['pvc','tubo pvc'],
        ['polietileno','pe','polietileno reticulado','pex'],
        ['descalcificador','ablandador','softener'],
        ['caldera','calentador','termo','boiler'],
        ['bombin','cilindro','cerradura']
      ];
      function tokenize(str){ var k = normKey(str); if(!k) return []; return k.split(' ').filter(function(t){ return t && !STOPWORDS.has(t); }); }
      function expandQuery(q){ var base = normKey(q), toks = tokenize(q), extra=[]; var joined = base; for (var g=0; g<SYN_GROUPS.length; g++){ var grp=SYN_GROUPS[g]; for (var i=0;i<grp.length;i++){ var phrase=normKey(grp[i]); if(phrase && joined.indexOf(phrase)>=0){ extra = extra.concat(grp); break; } } } for (var t=0; t<toks.length; t++){ for (var g2=0; g2<SYN_GROUPS.length; g2++){ var grp2=SYN_GROUPS[g2]; if(grp2.indexOf(toks[t])>=0) extra = extra.concat(grp2); } } var all = Array.from ? Array.from(new Set(toks.concat(extra.map(normKey)).filter(Boolean))) : toks; return { phrase: base, tokens: all }; }
      function lev(a,b){ a=a||''; b=b||''; var m=a.length, n=b.length; if(m===0) return n; if(n===0) return m; var dp=new Array(n+1); for(var j=0;j<=n;j++) dp[j]=j; for(var i=1;i<=m;i++){ var prev=dp[0]; dp[0]=i; for(var j=1;j<=n;j++){ var tmp=dp[j]; var cost=(a.charAt(i-1)===b.charAt(j-1))?0:1; dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+cost); prev=tmp; } } return dp[n]; }
      function sim(a,b){ var L=Math.max(a.length,b.length)||1; return 1 - (lev(a,b)/L); }
      function bestSim(tok, arr){ var best=0; for(var i=0;i<arr.length;i++){ var s=sim(tok, arr[i]); if(s>best) best=s; if(best>=0.92) break; } return best; }
      function contains(arr,t){ for(var i=0;i<arr.length;i++){ if(arr[i]===t) return true; } return false; }
      function startsWithAny(t, arr){ for(var i=0;i<arr.length;i++){ if(arr[i].indexOf(t)===0) return true; } return false; }
      function pickCol(cols,hints){ var nn=cols.map(function(c){return {raw:c,n:normKey(c)};}); var i,c; for(i=0;i<nn.length;i++){ c=nn[i]; if(hints.every(function(h){return c.n.indexOf(h)>=0;})) return c.raw; } for(i=0;i<nn.length;i++){ c=nn[i]; if(hints.some(function(h){return c.n.indexOf(h)>=0;})) return c.raw; } return null; }

      function fetchWorkbook(file){ var url=REPO_BASE+file; return fetch(url,{cache:'no-store',mode:'cors'}).then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status+' en '+file); return res.arrayBuffer(); }).then(function(ab){ return XLSX.read(ab,{type:'array'}); }); }
      function sheetToJSON(wb){ var name=wb.SheetNames.find(function(n){return /Hoja1|ALM|Sheet1/i.test(n);})||wb.SheetNames[0]; return XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:null}); }

      var cache={ prices:null, stock:{} };
      function loadPrices(){ if(cache.prices) return Promise.resolve(cache.prices); return fetchWorkbook(PRICE_FILE).then(function(wb){ var rows=sheetToJSON(wb); console.log('[PRECIOS] Filas:', rows.length); var cols=rows.length?Object.keys(rows[0]):[]; var cNum=pickCol(cols,['numero','articulo']); var cDesc=pickCol(cols,['descripcion','articulo']); var cFab=pickCol(cols,['fabricante']); var cPvp=pickCol(cols,['1','lista','precio','venta']); var map=new Map(); rows.forEach(function(r){ var id=r[cNum]; if(id==null) return; var key=String(id).trim(); map.set(key,{numero_articulo:key, descripcion:r[cDesc]||'', fabricante:r[cFab]||'', pvp:r[cPvp]}); }); cache.prices=map; return map; }); }
      function loadStock(center){ if(cache.stock[center]) return Promise.resolve(cache.stock[center]); return fetchWorkbook(STOCK_FILE(center)).then(function(wb){ var rows=sheetToJSON(wb); console.log('[STOCK] Centro', center, 'Filas:', rows.length); var cols=rows.length?Object.keys(rows[0]):[]; var cNum=pickCol(cols,['numero','articulo']); var cRef=pickCol(cols,['referencia','proveedor']); var cDesc=pickCol(cols,['descripcion']); var cFab=pickCol(cols,['fabricante']); var cStk=pickCol(cols,['stock']); var list=rows.map(function(r){ return { numero_articulo:String(r[cNum]||'').trim(), ref_proveedor:r[cRef]||'', descripcion:r[cDesc]||'', fabricante:r[cFab]||'', stock:Number(r[cStk]||0) }; }).filter(function(x){return x.numero_articulo;}); cache.stock[center]=list; return list; }); }

      function formatEUR(val){ if(val==null||val==='') return '-'; var n= (typeof val==='number')? val : parseFloat(String(val).replace(/\./g,'').replace(',','.')); if(!isFinite(n)) return '-'; return n.toLocaleString(window.currentLang||'es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
      function mergeItem(s,p){ return { numero_articulo:s.numero_articulo, ref_proveedor:s.ref_proveedor||null, descripcion_final:(p && p.descripcion) || s.descripcion || '-', fabricante:(p && p.fabricante) || s.fabricante || '-', stock:s.stock||0, precio_eur:formatEUR(p && p.pvp) }; }
      function score(qs, it){ var exp = expandQuery(qs); if((!exp.tokens || !exp.tokens.length) && !exp.phrase) return 0; var dT = tokenize(it.descripcion_final==null?'':it.descripcion_final); var rT = tokenize(it.ref_proveedor==null?'':it.ref_proveedor); var nT = tokenize(it.numero_articulo==null?'':it.numero_articulo); var fT = tokenize(it.fabricante==null?'':it.fabricante); var dS=dT.join(' '), fS=fT.join(' '), rS=rT.join(' '), nS=nT.join(' '); var s=0, phrase=exp.phrase; if(phrase){ if(nS===phrase || rS===phrase) s+=150; if(dS.indexOf(phrase)>=0) s+=50; if(fS.indexOf(phrase)>=0) s+=25; } for(var i=0;i<exp.tokens.length;i++){ var t=exp.tokens[i]; if(!t) continue; if(contains(dT,t)) s+=8; else { var sd=bestSim(t,dT); if(sd>=0.82) s += 5*sd; else if(startsWithAny(t,dT)) s+=3; } if(contains(fT,t)) s+=6; else { var sf=bestSim(t,fT); if(sf>=0.84) s += 4*sf; } if(contains(rT,t)) s+=14; else { var sr=bestSim(t,rT); if(sr>=0.85) s += 8*sr; } if(contains(nT,t)) s+=14; else { var sn=bestSim(t,nT); if(sn>=0.85) s += 8*sn; } } if(exp.tokens.length && startsWithAny(exp.tokens[0], dT)) s += 4; if(!it.precio_eur || it.precio_eur==='-') s -= 2; return s; } return s; }

      function render(items, qStr){ var L=window.currentLang||'es-ES'; var TXT={ 'es-ES':{results:'Resultados',of:'coincidencias',back:'← Volver',price:'Precio',stock:'Stock',prov:'Ref. proveedor',mfg:'Fabricante', alt:function(n,qty){return 'Actualmente no disponemos de stock en este centro, pero en el centro de '+n+' disponemos de '+qty+' unidades. Por favor, hable con el mostrador para tramitar el suministro.';}}, 'en-US':{results:'Results',of:'matches',back:'← Back',price:'Price',stock:'Stock',prov:'Supplier ref.',mfg:'Manufacturer', alt:function(n,qty){return 'We currently have no stock at this store, but '+qty+' units are available at the '+n+' branch. Please speak to the counter to arrange supply.';}}, 'de-DE':{results:'Ergebnisse',of:'Treffer',back:'← Zurück',price:'Preis',stock:'Bestand',prov:'Lieferantenref.',mfg:'Hersteller', alt:function(n,qty){return 'Derzeit kein Bestand in diesem Standort, aber '+qty+' Stück sind im Standort '+n+' verfügbar. Bitte wenden Sie sich an den Schalter für die Bestellung.';}} }[L];
        titleEl.textContent=TXT.results; subEl.textContent= items.length+' '+TXT.of+' · Centro: '+getCurrentCenterName()+' · “'+qStr+'”'; backBtn.textContent=TXT.back;
        gridEl.innerHTML= items.map(function(it){ var ok=(Number(it.stock)||0)>0; var badge= ok?('<span class="stock ok">'+TXT.stock+': '+it.stock+'</span>'):( '<span class="stock zero">'+TXT.stock+': 0</span>'); var alt= it._altStock ? ('<div class="meta" style="margin-top:6px"><em>'+ TXT.alt(CODE_TO_CENTER[it._altStock.center], it._altStock.qty) +'</em></div>') : ''; return '<article class="card" role="button" tabindex="0" data-id="'+it.numero_articulo+'">\n  <h3>'+ it.descripcion_final +'</h3>\n  <div class="meta">\n    <span><strong>'+TXT.prov+':</strong> '+ (it.ref_proveedor==null?'-':it.ref_proveedor) +'</span>\n    <span><strong>'+TXT.mfg+':</strong> '+ (it.fabricante||'-') +'</span>\n  </div>\n  <div class="price-stock">\n    <div class="price">'+ (it.precio_eur||'-') +'</div>\n    '+ badge +'\n  </div>\n  '+alt+'\n</article>'; }).join('');
        resultsEl.setAttribute('aria-hidden','false'); }

      function findAltStock(numArt, excludeCenter){ var order=[1,2,3,4,7]; var i=0; function step(){ if(i>=order.length) return Promise.resolve(null); var c=order[i++]; if(c===excludeCenter) return step(); return loadStock(c).then(function(list){ var hit=list.find(function(x){return x.numero_articulo===numArt && Number(x.stock)>0;}); return hit? {center:c, qty:Number(hit.stock)} : step(); }); } return step(); }

      function performSearch(query){ try{ var center=getCurrentCenterCode(); titleEl.textContent='Resultados'; subEl.textContent='Cargando…'; resultsEl.setAttribute('aria-hidden','false'); Promise.all([loadPrices(), loadStock(center)]).then(function(arr){ var prices=arr[0], stock=arr[1]; var merged=stock.map(function(s){ return mergeItem(s, prices.get(s.numero_articulo)); }); merged.forEach(function(m){ m.__score=score(query,m); }); merged.sort(function(a,b){return b.__score-a.__score;}); var top=merged.filter(function(x){return x.__score>0;}).slice(0,12); if(top.length===0) top=merged.slice(0,12); var k=0; function enrich(){ if(k>=top.length) return render(top, query); var it=top[k++]; if(Number(it.stock)<=0){ findAltStock(it.numero_articulo, center).then(function(res){ it._altStock=res; enrich(); }); } else enrich(); } enrich(); }).catch(function(e){ console.error('[performSearch] Error', e); subEl.textContent='Error cargando datos: '+(e&&e.message?e.message:e); }); }catch(e){ console.error('[performSearch] Error', e); subEl.textContent='Error cargando datos: '+(e&&e.message?e.message:e); } }

      // Exponer para depuración
      window.__searchRepo = performSearch;
      window._debug = { performSearch: performSearch };
      console.info('[HUB] ready:', {lang: window.currentLang, center: getCurrentCenterName()});

      // Go + Enter
      goBtn.onclick=function(){ performSearch(q.value.trim()); };
      q.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); performSearch(q.value.trim()); } });

      // Voz (SpeechRecognition)
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      function startSpeech(){ if(!SR){ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='Reconocimiento de voz no disponible'; return; } var isSecure= location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname); if(!isSecure){ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='La voz requiere HTTPS o ejecutar en localhost'; return; } var rec=new SR(); rec.lang=window.currentLang||'es-ES'; rec.interimResults=false; rec.maxAlternatives=1; rec.onresult=function(ev){ var final=''; for(var i=ev.resultIndex;i<ev.results.length;i++){ var r=ev.results[i]; if(r.isFinal) final+= r[0].transcript + ' '; } if(final.trim()){ q.value=(q.value? q.value+' ' : '') + final.trim(); performSearch(q.value.trim()); } }; rec.onerror=function(){ resultsEl.setAttribute('aria-hidden','false'); subEl.textContent='No se pudo captar audio'; }; try{ rec.start(); }catch(e){} }
      document.getElementById('mic').addEventListener('click', startSpeech);

      backBtn.addEventListener('click', function(){ resultsEl.setAttribute('aria-hidden','true'); });
    })();
  </script>
</body>
