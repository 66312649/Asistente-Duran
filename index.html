<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DURAN · HUD Home</title>
<link rel="icon" href="logo-duran.png"/>
<style>
:root{
  --bg:#0b0f22; --bg2:#101738;
  --ink:#eaf2ff; --mut:#a9b7e6;
  --line:rgba(255,255,255,.15); --glass:rgba(255,255,255,.06);
  --brand:#57a3ff; --cyan:#6ee6ff; --vio:#9aa2ff;
}
*{box-sizing:border-box} html,body{height:100%}
body{
  margin:0;color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial;
  background:
    radial-gradient(1200px 800px at 50% -10%, #2847b7 0%, #1a2d6b 45%, #101738 70%, #0b0f22 100%),
    linear-gradient(180deg,#0b0f22,#101738);
}
/* --- Layout principal --- */
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.header{position:relative;padding:12px 16px}
.grid{
  display:grid;gap:18px;padding:12px 16px 24px;
  grid-template-columns:minmax(220px,24vw) 1fr minmax(220px,24vw);
  grid-template-rows:auto 1fr auto; align-items:center;
}
@media (max-width:900px){
  .grid{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;gap:16px}
  .left,.right,.bottom{justify-self:stretch}
}
/* --- Reloj grande --- */
.clock{position:absolute;left:16px;top:8px;text-shadow:0 0 18px rgba(110,230,255,.35)}
.hhmm{font-weight:800;letter-spacing:.04em;opacity:.92;
  font-size:clamp(28px,7.2vmin,82px);line-height:1}
.dmy{font-size:12px;color:var(--mut);margin-top:2px}
/* --- Botón Admin (diminuto) --- */
.adminDot{
  position:absolute;right:14px;top:12px;width:18px;height:18px;border-radius:50%;
  border:1px solid rgba(110,230,255,.5);background:rgba(255,255,255,.08);box-shadow:0 0 12px rgba(110,230,255,.25);
  display:grid;place-items:center;font-size:11px;color:var(--ink);cursor:pointer
}
.adminPanel{position:fixed;right:10px;top:34px;display:none;z-index:40;
  border:1px solid var(--line);background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
  backdrop-filter:blur(10px);border-radius:12px;padding:10px;font-size:12px;color:var(--mut)}
/* --- Rótulo central --- */
.titleWrap{grid-column:1/-1;display:grid;justify-items:center}
.title{
  padding:.45em 1.1em;border-radius:10px;border:1px solid var(--line);background:var(--glass);
  position:relative;text-transform:uppercase;font-weight:700;letter-spacing:.06em;font-size:14px
}
.title::before,.title::after{
  content:"";position:absolute;left:-26px;right:-26px;height:1px;top:0;
  background:linear-gradient(90deg,transparent, rgba(110,230,255,.7), rgba(154,162,255,.7), rgba(110,230,255,.7), transparent);
  box-shadow:0 0 18px rgba(110,230,255,.25), inset 0 0 18px rgba(110,230,255,.25)
}
.title::after{top:auto;bottom:0}
/* --- Listas tipo “cartucho” con esquinas bisel --- */
.stack{display:grid;gap:12px}
.card{
  padding:.9em 1.1em;border:1px solid rgba(110,230,255,.35);border-radius:12px;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  position:relative;cursor:pointer;user-select:none
}
.card::after{ /* bisel derecho */
  content:"";position:absolute;right:-1px;top:10px;width:22px;height:calc(100% - 20px);border-right:1px solid rgba(110,230,255,.45);
  border-top:1px solid rgba(110,230,255,.35);border-bottom:1px solid rgba(110,230,255,.35);border-radius:10px;opacity:.7}
.card:hover{box-shadow:0 0 20px rgba(110,230,255,.16) inset}
.tag{font-weight:700;letter-spacing:.02em}
/* --- Centro HUD (esfera + logo) --- */
.center{display:grid;justify-items:center;align-items:center;position:relative}
.sphere{
  width:clamp(220px,34vmin,420px);height:clamp(220px,34vmin,420px);border-radius:50%;
  border:1px solid rgba(120,180,255,.55);
  box-shadow:0 0 26px rgba(80,180,255,.45), inset 0 0 36px rgba(80,180,255,.28);
  position:relative;overflow:hidden;background:radial-gradient(200px 100px at 50% 22%, rgba(120,180,255,.35), transparent 60%)
}
.sphere .g{position:absolute;inset:-26%;background:conic-gradient(from 0deg at 50% 50%, #4ea3ff, #7cc5ff, #a78bfa, #5ab3ff, #4ea3ff);filter:blur(18px);opacity:.95;animation:rot 8s linear infinite}
.sphere .ring{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);border-radius:50%;
  border:1px solid rgba(120,180,255,.75);box-shadow:0 0 18px rgba(120,180,255,.45) inset;animation:pulse 2.1s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}} @keyframes pulse{0%{transform:translate(-50%,-50%) scale(.96);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.08);opacity:.5}100%{transform:translate(-50%,-50%) scale(.96);opacity:.9}}
/* Logo DURAN como trazo azul dentro del núcleo */
.logoCore{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:48%;height:48%;background:var(--brand);
  -webkit-mask:url("logo-duran.png") center/contain no-repeat;
          mask:url("logo-duran.png") center/contain no-repeat;
  filter:drop-shadow(0 0 16px rgba(87,163,255,.55)) drop-shadow(0 0 28px rgba(110,230,255,.25))
}
/* Transcripción centrada (no pisa la esfera) */
.transc{margin-top:10px;color:var(--mut);font-size:14px;text-align:center;max-width:min(680px,90vw)}
/* --- Línea de cables (SVG encima) --- */
#wire{position:absolute;inset:0;pointer-events:none}
/* --- Categorías abajo --- */
.bottom{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.bottom{grid-template-columns:repeat(2,1fr)}}
.cat{padding:1em 1.1em;text-align:center}
footer{padding:10px 14px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
/* --- FAB pantalla completa --- */
.fab{position:fixed;left:12px;bottom:12px;width:28px;height:28px;border-radius:999px;border:1px solid rgba(110,230,255,.45);background:rgba(255,255,255,.06);box-shadow:0 0 14px rgba(110,230,255,.18);color:var(--ink);display:grid;place-items:center;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="clock"><div class="hhmm" id="hhmm">00:00</div><div class="dmy" id="dmy">—</div></div>
    <button class="adminDot" id="admBtn" title="Modo admin">⚙</button>
    <div class="adminPanel" id="admPanel">Modo administrador (demo). Contraseña: <b>0666</b></div>
  </div>

  <main class="grid" id="stage">
    <div class="titleWrap"><div class="title">¿En qué puedo ayudarle?</div></div>

    <!-- Idiomas -->
    <aside class="left stack" id="langs">
      <div class="card" data-lang="es"><span class="tag">ESPAÑOL</span></div>
      <div class="card" data-lang="en"><span class="tag">INGLÉS</span></div>
      <div class="card" data-lang="de"><span class="tag">ALEMÁN</span></div>
    </aside>

    <!-- HUD central -->
    <section class="center" id="hub">
      <svg id="wire"></svg>
      <div class="sphere" id="sphere"><div class="g"></div><div class="ring"></div><div class="logoCore" title="DURAN"></div></div>
      <div class="transc" id="transc">Listo</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="mic" title="Hablar" class="card" style="padding:.5em .8em">🎙️ Hablar</button>
        <button id="mute" class="card" style="padding:.5em .8em">⏹️ Parar</button>
      </div>
    </section>

    <!-- Almacenes -->
    <aside class="right stack" id="centers">
      <div class="card" data-center="palma"><span class="tag">PALMA</span></div>
      <div class="card" data-center="calvia"><span class="tag">CALVIÀ</span></div>
      <div class="card" data-center="alcudia"><span class="tag">ALCUDIA</span></div>
      <div class="card" data-center="santanyi"><span class="tag">SANTANYÍ</span></div>
    </aside>

    <!-- Categorías -->
    <div class="bottom">
      <div class="card cat">CONSTRUCCIÓN</div>
      <div class="card cat">FERRETERÍA</div>
      <div class="card cat">FONTANERÍA</div>
      <div class="card cat">ELECTRICIDAD</div>
    </div>
  </main>

  <footer>Interfaz HUD · © DURAN</footer>
</div>

<!-- Pantalla completa -->
<button class="fab" id="fs" title="Pantalla completa">⤢</button>

<script>
/* ===== Reloj ===== */
function updClock(){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('hhmm').textContent=`${hh}:${mm}`;
  document.getElementById('dmy').textContent=now.toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long'}).replace(/^./,c=>c.toUpperCase());
}
setInterval(updClock,1000); updClock();

/* ===== Fullscreen FAB ===== */
document.getElementById('fs').onclick=()=>{const el=document.documentElement;if(!document.fullscreenElement){el.requestFullscreen?.()}else{document.exitFullscreen?.()}};

/* ===== Admin botón diminuto ===== */
const admBtn=document.getElementById('admBtn'), admPanel=document.getElementById('admPanel');
admBtn.onclick=()=>{
  if(admPanel.style.display!=='block'){
    const p=prompt('Contraseña:'); if(p!=='0666'){ alert('Incorrecta'); return }
    admPanel.style.display='block';
  }else{admPanel.style.display='none'}
};

/* ===== Voz: TTS + STT (demostración rápida) ===== */
let lang='es', listening=false, rec=null;
const transc=document.getElementById('transc'), sphere=document.getElementById('sphere');
const LANGS={es:{tag:'es-ES',greet:'Buenos días. ¿En qué puedo ayudarle?'},en:{tag:'en-GB',greet:'Good morning. How can I help?'},de:{tag:'de-DE',greet:'Guten Tag. Wie kann ich helfen?'}};
function speak(t){
  try{
    const u=new SpeechSynthesisUtterance(t); u.lang=LANGS[lang].tag; speechSynthesis.cancel(); speechSynthesis.speak(u);
    sphere.classList.add('speaking'); setTimeout(()=>sphere.classList.remove('speaking'),Math.min(8000, t.split(/\s+/).length*340));
  }catch{}
}
function listenStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ transc.textContent='Navegador sin reconocimiento de voz.'; return }
  rec=new SR(); rec.lang=LANGS[lang].tag; rec.continuous=true; rec.interimResults=true;
  rec.onstart=()=>{listening=true; sphere.classList.add('listening'); transc.textContent='Escuchando…'};
  rec.onresult=(ev)=>{let i='',f='';for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k]; if(r.isFinal) f+=r[0].transcript+' '; else i+=r[0].transcript}
    transc.textContent=(f||i||'…')}
  rec.onend=()=>{listening=false; sphere.classList.remove('listening');};
  rec.start();
}
document.getElementById('mic').onclick=()=>{ if(!listening) listenStart() };
document.getElementById('mute').onclick=()=>{ try{listening=false; rec&&rec.stop()}catch{} };

/* Idiomas / Centros */
document.getElementById('langs').addEventListener('click',e=>{
  const el=e.target.closest('.card[data-lang]'); if(!el) return; lang=el.dataset.lang; speak(LANGS[lang].greet);
});
document.getElementById('centers').addEventListener('click',e=>{
  const el=e.target.closest('.card[data-center]'); if(!el) return; const c=el.dataset.center.toUpperCase(); speak(`Centro ${c}. ¿Qué necesita?`);
});

/* ===== Wires: dibuja líneas desde tarjetas al anillo central ===== */
const wireSvg=document.getElementById('wire');
function drawWires(){
  const hubRect=document.getElementById('hub').getBoundingClientRect();
  const sphereRect=sphere.getBoundingClientRect();
  const cx=sphereRect.left+sphereRect.width/2 - hubRect.left;
  const cy=sphereRect.top+sphereRect.height/2 - hubRect.top;

  function anchors(query){
    return [...document.querySelectorAll(query)].map(el=>{
      const r=el.getBoundingClientRect();
      const x=(r.left< sphereRect.left)? (r.right - hubRect.left) : (r.left - hubRect.left);
      const y=r.top + r.height/2 - hubRect.top;
      return {x,y};
    });
  }
  const L=anchors('#langs .card'), R=anchors('#centers .card');

  const W=hubRect.width, H=hubRect.height;
  wireSvg.setAttribute('viewBox',`0 0 ${W} ${H}`); wireSvg.innerHTML='';
  const mk=(x1,y1,x2,y2)=>`M ${x1} ${y1} L ${x2} ${y2}`;
  const add=(d)=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);
    p.setAttribute('stroke','url(#g)');
    p.setAttribute('stroke-width','1.4'); p.setAttribute('fill','none');
    p.setAttribute('opacity','0.9');
    wireSvg.appendChild(p);
  };
  // gradiente
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  const g=document.createElementNS('http://www.w3.org/2000/svg','linearGradient'); g.id='g'; g.setAttribute('x1','0'); g.setAttribute('x2','1'); g.innerHTML=
    `<stop offset="0" stop-color="rgba(110,230,255,.1)"/><stop offset="0.5" stop-color="rgba(110,230,255,.8)"/><stop offset="1" stop-color="rgba(154,162,255,.6)"/>`;
  defs.appendChild(g); wireSvg.appendChild(defs);

  const r = sphereRect.width*0.35; // radio aproximado del anillo interno
  const hit=(ax,ay)=>{ // proyecta hacia el centro y corta en el círculo r
    const dx=cx-ax, dy=cy-ay; const len=Math.hypot(dx,dy); const ux=dx/len, uy=dy/len;
    return {x: cx-ux*r, y: cy-uy*r};
  };
  [...L,...R].forEach(a=>{ const h=hit(a.x,a.y); add(mk(a.x,a.y,h.x,h.y)) });
}
new ResizeObserver(drawWires).observe(document.getElementById('stage'));
window.addEventListener('load',drawWires); window.addEventListener('resize',drawWires);
</script>
</body>
</html>
